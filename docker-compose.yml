# Run with:  docker compose --env-file credentials.env up --build
# The --env-file makes the secrets in credentials.env available both for
# variable substitution below and (via env_file:) inside the containers.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # Root/admin credentials must match MONGODB_ADMIN_* in credentials.env.
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ADMIN_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ADMIN_PASSWORD:-upaelo}
    # host:container. The host side (27018) only matters if you want to reach
    # this Mongo from the host; the API talks to it internally on 27017.
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      # Built-in KMS key enabling SSE-S3 (format: <name>:<base64-32-bytes>).
      MINIO_KMS_SECRET_KEY: nilo-key:${MINIO_KMS_KEY}
    ports:
      - "9002:9000"   # S3 API      (host 9002 -> container 9000)
      - "9003:9001"   # Web console  (host 9003 -> container 9001)
    volumes:
      - minio_data:/data

  api:
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
      - minio
    # Secrets injected into the container.
    env_file:
      - credentials.env
    # Container-network overrides (win over config.yaml and credentials.env).
    # These use the INTERNAL container ports/hostnames, independent of the
    # host-side port mappings above.
    environment:
      MONGODB_HOST: mongo
      MONGODB_PORT: 27017
      MINIO_ENDPOINT: minio:9000
      # Comma-separated browser origins (frontend URL). Override on deploy if IP/hostname changes.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://192.168.1.43:8080,https://192.168.1.43:8080,http://localhost:8080,https://localhost:8080,http://127.0.0.1:8080,https://127.0.0.1:8080}
    ports:
      - "0.0.0.0:8001:8000"

  # HTTPS en desarrollo (cert autofirmado en ./certs). API: https://<host>:8443/api/v1
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles:
      - https
    depends_on:
      - api
    ports:
      - "0.0.0.0:8443:8443"
    volumes:
      - ./certs:/certs:ro
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  mongo_data:
  minio_data:
