# NILO backend - non-sensitive configuration.
# Secrets (connection URIs, keys, passwords) live in credentials.env.
# Any value here can be overridden by an environment variable of the same name.

# --- General ---
PROJECT_NAME: NILO
ENVIRONMENT: development
DEBUG: true
API_V1_PREFIX: /api/v1

# --- Infra: MongoDB + MinIO (un solo sitio para la conexión) ---
# NILO_INFRA_HOST: IP o hostname donde escuchan Mongo y MinIO (puertos abajo).
#   127.0.0.1  -> misma máquina (API local o en VM con Mongo/MinIO en el host vía puertos Docker).
#   192.168.x.x -> otra máquina (p. ej. host físico si la API corre solo en una VM).
# También puedes exportar NILO_INFRA_HOST=... sin editar este fichero.
NILO_INFRA_HOST: 127.0.0.1
# Puertos publicados en NILO_INFRA_HOST (docker-compose: mongo 27018, minio 9002).
MONGODB_PORT: 27018
MINIO_API_PORT: 9002
# Opcional: IP/DNS distinta para URLs presignadas de MinIO (nilo-node, navegador).
# Si no se define, se usa NILO_INFRA_HOST. En Docker all-in-one suele ser la IP LAN del host.
# MINIO_PUBLIC_HOST: 192.168.1.43

# --- MongoDB (usuarios; contraseñas en credentials.env) ---
# MONGODB_HOST / MINIO_* se derivan de NILO_INFRA_HOST salvo override por env o docker-compose.
MONGODB_DB: nilo
MONGODB_ADMIN_USER: admin
MONGODB_ADMIN_AUTH_SOURCE: admin
MONGODB_APP_USER: nilo
MONGODB_PROVISION: true

# --- MinIO / S3 (claves en credentials.env) ---
MINIO_SECURE: false
MINIO_BUCKET: nilo-data
MINIO_PRESIGN_EXPIRY: 3600
MINIO_SSE: true

# --- Security / JWT (non-sensitive) ---
# JWT_SECRET_KEY is set in credentials.env.
JWT_ALGORITHM: HS256
ACCESS_TOKEN_EXPIRE_MINUTES: 60
REFRESH_TOKEN_EXPIRE_MINUTES: 43200  # 30 days

# --- Bootstrap root user (non-sensitive part) ---
# ROOT_EMAIL / ROOT_PASSWORD are set in credentials.env.
ROOT_FULL_NAME: NILO Root

# --- Seed demo users (non-sensitive part) ---
SEED_USERS: true

# --- User photos ---
MAX_PHOTO_BYTES: 2097152  # 2 MB

# --- Video / recording defaults ---
DEFAULT_VIDEO_CHUNK_SECONDS: 300
DEFAULT_HLS_SEGMENT_SECONDS: 6

# --- CORS ---
CORS_ORIGINS:
  - "http://192.168.1.43:8080"
  - "https://192.168.1.43:8080"
  - "http://localhost:8080"
  - "https://localhost:8080"
  - "http://127.0.0.1:8080"
  - "https://127.0.0.1:8080"
CORS_ORIGIN_REGEX: "^https?://(localhost|127\\.0\\.0\\.1|192\\.168\\.\\d{1,3}\\.\\d{1,3}|10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|172\\.(1[6-9]|2\\d|3[0-1])\\.\\d{1,3}\\.\\d{1,3}|[\\w-]+(?:\\.[\\w-]+)*):\\d+$"

# --- Backups ---
# Directorio en el host (montado en /app/backups en el contenedor API).
BACKUP_DIR: backups
BACKUP_RETENTION_DAYS: 14

# --- Disco (GET /health) ---
DISK_WARN_USED_PERCENT: 85
DISK_CRITICAL_USED_PERCENT: 95
DISK_CHECK_PATHS:
  - /
  - /var/minio-data
  - /var/mongo-data
