# API en otra máquina (p. ej. VM) con Mongo + MinIO en el host.
#
# En el host físico:
#   docker compose --env-file credentials.env up -d mongo minio
#
# En la VM (ajusta NILO_INFRA_HOST en config.yaml o aquí):
#   docker compose -f docker-compose.api-only.yml --env-file credentials.env up --build -d
#
# NILO_INFRA_HOST = IP del host vista desde la VM (no uses 127.0.0.1 salvo que Mongo/MinIO estén en la VM).

services:
  api:
    build: .
    restart: always
    env_file:
      - credentials.env
    environment:
      NILO_INFRA_HOST: ${NILO_INFRA_HOST:-127.0.0.1}
      MONGODB_PORT: ${MONGODB_PORT:-27018}
      MINIO_API_PORT: ${MINIO_API_PORT:-9002}
      MINIO_PUBLIC_HOST: ${MINIO_PUBLIC_HOST:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,https://localhost:8080}
    ports:
      - "0.0.0.0:8001:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8000/health'', timeout=5)"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
